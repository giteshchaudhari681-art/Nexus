name: Nexus CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  repository-validation:
    name: Repository Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Foundation Files
        run: |
          echo "Checking required files..."
          files=( "README.md" ".gitignore" ".env.example" "docs/ENGINEERING_CONSTITUTION.md" "docs/PR_BOUNDARY.md" )
          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Error: Missing $file"
              exit 1
            fi
          done
          echo "All foundation files present."

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  gateway-core-checks:
    name: Gateway Core CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./gateway-core
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './gateway-core/package-lock.json'
          
      - name: Install dependencies
        run: npm install --legacy-peer-deps
        
      - name: Lint
        run: npm run lint
        
      - name: Type Check
        run: npx tsc --noEmit
        
      - name: Run Tests
        run: npm run test
        
      - name: Build
        run: npm run build
